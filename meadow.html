<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Pievos (Meadow)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        h1 { color: #2c3e50; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 8px; border-bottom: 1px solid #eee; }
        .lt-name { font-weight: bold; margin-right: 10px; }
        .de-name { color: #666; font-style: italic; }
        .source-of { color: #666; font-style: normal; }
        .url { color: #666; font-style: underline; margin-right: 10px; }
    </style>
</head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-49WKN3NH9J"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-49WKN3NH9J');
</script>
<body>
       <p><a href="start.html" style="text-decoration: none; color: #e67e22;">← Atgal į pagrindinį (Back to main page)</a></p>
    <h1>Pievos (Meadow)</h1>
    <ul id="forest-list"></ul>

    <script>
        fetch('ktowns.geojson')
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById('forest-list');
                const filteredFeatures = data.features.filter(feature => 
                    feature.properties.adm_ru === "K" && feature.properties.adm === "M"
                );
                filteredFeatures.sort((a, b) => 
                    (a.properties.lt_names || '').localeCompare(b.properties.lt_names || '', 'lt')
                );
                filteredFeatures.forEach(feature => {
                    const li = document.createElement('li');
                    const [longitude, latitude] = feature.geometry.coordinates[0];
                    const mapX = longitude * 20037508.34 / 180;
                    const mapY = Math.log(Math.tan((90 + latitude) * Math.PI / 360)) / (Math.PI / 180) * 20037508.34 / 180;
                    const mapSize = 500;
                    const mapUrl = `https://qgiscloud.com/Townames/KL14/?l=Apskrities%20centras%2CParapijos%20centras%2CVietov%C4%97%2CMi%C5%A1kas%2CMikrotoponimas%2CPiliakalnis%2CJ%C5%ABros%20%C4%AFlanka%2CJ%C5%ABros%20kranto%20linija%2CE%C5%BEerai%2CE%C5%BEer%C5%B3%20pavadinimai%2CDidel%C4%97s%20up%C4%97s%2CUp%C4%97s%2CPalv%C4%97s%2CLietuvos%20siena%2CLenkijos%20siena%2Cktowns%20copy%20copy!%2Cupeskl_2!&bl=osm_hdm&t=KL14&e=${mapX - mapSize},${mapY - mapSize},${mapX + mapSize},${mapY + mapSize}`;
                    li.innerHTML = `
                        <span class="lt-name"><a href="${mapUrl}" target="_blank" rel="noopener noreferrer">${feature.properties.lt_names || '---'}</a></span>
                        <span class="de-name">(${feature.properties.de_names || '---'})</span>
                        <span class="source-of">${feature.properties.source_of_ || '---'}</span>
                        <span class="url">
                            ${feature.properties.url 
                            ? `<a href="${feature.properties.url}" target="_blank" rel="noopener noreferrer">${feature.properties.url}</a>` 
                            : ';---'}
                        </span>
                    `;
                    list.appendChild(li);
                });
            })
            .catch(error => {
                console.error('Error loading geojson:', error);
            });
    </script>
</body>
</html>
