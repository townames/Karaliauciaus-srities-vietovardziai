<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Upės (Rivers)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        h1 { color: #2c3e50; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 8px; border-bottom: 1px solid #eee; }
        .name_lt { font-weight: bold; margin-right: 10px; }
        .name_lt a { color: inherit; }
        .name_de { color: #666; font-style: italic; }
        .source_de { color: #666; font-style: normal; margin-right: 10px;  }
       
    </style>
</head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-49WKN3NH9J"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-49WKN3NH9J');
</script>
<body>
       <p><a href="start.html" style="text-decoration: none; color: #e67e22;">← Atgal į pagrindinį (Back to main page)</a></p>
    <h1>Upės (Rivers)</h1>
    <ul id="river-list"></ul>

    <script>
        fetch('upeskl_2.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to load river data: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                const list = document.getElementById('river-list');
                const filteredFeatures = data.features.filter(feature =>
                    feature.properties.name_12 !== "e"
                );

                filteredFeatures.sort((a, b) => 
                    (a.properties.name_lt || '').localeCompare(b.properties.name_lt || '', 'lt')
                );

                filteredFeatures.forEach(feature => {
                    const li = document.createElement('li');
                    const [longitude, latitude] = feature.geometry.coordinates[0][0];
                    const mapUrl = `https://www.openstreetmap.org/?mlat=${latitude}&mlon=${longitude}#map=15/${latitude}/${longitude}`;
                    li.innerHTML = `
                        <span class="name_lt"><a href="${mapUrl}" target="_blank" rel="noopener noreferrer">${feature.properties.name_lt || '---'}</a></span>
                        <span class="name_de">(${feature.properties.name_de || '---'})</span>
                        <span class="source_de">${feature.properties.source_de || '---'}</span>

                    `;
                    list.appendChild(li);
                });
            })
            .catch(error => {
                console.error('Error loading geojson:', error);
            });
    </script>
</body>
</html>
